# Copy to bot.toml (git-ignored) and replace the placeholder key. Placeholder only.

[server]
host = "127.0.0.1"
port = 64738
name = "Mumbot"
channel = "Lobby"

[http]
listen = "127.0.0.1:8080"
rate_limit_per_minute = 20
delivery_timeout_secs = 3

[[keys]]
key = "REPLACE-WITH-A-LONG-RANDOM-KEY"
label = "example"
channels = ["Lobby"]

# One block per channel password. The bot presents it at login.
# [[token]]
# channel = "Secret"
# password = "hunter2"

# Only for `mumbot peer` (relay discovery for Mumcord clients, docs/peer.md). It also needs
# server.server_cert_sha256 (SHA-256 of the Mumble server certificate). The API secret comes from
# MUMBOT_PEER_API_SECRET or a private file, never from this file.
# [peer]
# api_url = "http://127.0.0.1:7480"
# api_secret_file = "/run/secrets/mumbot_peer_api_secret"
# api_fp = "SHA-256 OF THE RELAY API CERTIFICATE, REQUIRED FOR HTTPS"

# Only for `mumbot plugins` (Mumcord plugin suggestions, docs/plugins.md). 1 to 8 entries; needs
# server.server_cert_sha256 and a registered bot user.
# [[plugins.announce]]
# id = "dice"
# min = "1.0.0"
# source = "official"
# for = "board game nights"
# [[plugins.announce]]
# id = "guild-calendar"
# min = "0.9.0"
# source = "https://plugins.example.org/v1/index.json"
# key = "MINISIGN PUBLIC KEY OF THAT REPOSITORY (RW...)"
# for = "raid sign-ups"

# Only for `mumbot history` (channel history for Mumcord clients, docs/history.md). Nothing is
# recorded that is not listed; private messages and voice never are.
# [history]
# channels = ["Lobby"]
# exclude = ["AFK"]
# retention_days = 7
# max_messages_per_channel = 5000
# database = "history.sqlite3"
