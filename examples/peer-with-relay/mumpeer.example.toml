# Copy to mumpeer.toml and adjust public_host. Every key and its default: mumpeer's
# mumpeer.example.toml and README (Mumcord/mumpeer).

# The address Mumcord clients connect to. 127.0.0.1 works for clients on this machine; use the
# host's public name or IP (and RELAY_BIND=0.0.0.0 in .env) for others.
public_host = "127.0.0.1"
udp_listen = "[::]:443"
tcp_listen = "[::]:443"
# Loopback only; the bot shares this container's network namespace.
api_listen = "127.0.0.1:7480"
data_dir = "/var/lib/mumpeer"
# The API secret comes from MUMPEER_API_SECRET (PEER_API_SECRET in .env).

[limits]
max_sessions = 50
token_ttl_s = 120
