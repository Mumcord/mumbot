# Load-test server for scale measurements (1000 users, ~300 channels). Separate compose project so
# it never touches the normal test server. Start with testenv/scale/up.sh, stop with down.sh.
services:
  scale:
    image: mumblevoip/mumble-server:v1.5.735
    restart: "no"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      MUMBLE_SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?copy testenv/.env.example to testenv/.env}
      MUMBLE_ACCEPT_UNKNOWN_SETTINGS: "true"
      MUMBLE_CONFIG_SERVERPASSWORD: ${SERVER_PASSWORD:-}
      MUMBLE_CONFIG_SSLCERT: /certs/cert.pem
      MUMBLE_CONFIG_SSLKEY: /certs/key.pem
      MUMBLE_CONFIG_REGISTERNAME: Mumbot Scale Server
      MUMBLE_CONFIG_BANDWIDTH: "72000"
      MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"
      # Load-test only: room for 1000 bots plus the client under test.
      MUMBLE_CONFIG_USERS: "1500"
    ports: ["${PORT_SCALE}:64738/tcp", "${PORT_SCALE}:64738/udp"]
    volumes: ["../data/scale:/data", "../certs:/certs:ro"]
