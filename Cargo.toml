[package]
name = "mumbot"
description = "Headless Mumble bots for standard Mumble servers: webhook and peer modules, plus a scripted test bot in the tester build"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/Mumcord/mumbot"
publish = false

[dependencies]
# Published by the Mumcord client project; a minor bump (by hand or Dependabot) must pass the
# live tests. mumcord-codec (Opus without device I/O, so static builds need no ALSA) gives the
# test bot's voice the same codec settings as the client.
mumcord-protocol = "0.4"
mumcord-codec = { version = "0.4", optional = true }
bytes = { version = "1", optional = true }
hound = { version = "3.5", optional = true }
tokio = { version = "1.54", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
# Peer bot: TLS to the relay API with a pinned certificate, on the rustls/ring stack that
# mumcord-protocol already brings in (no extra crypto library).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ring = "0.17"

[features]
# The scripted test bot (test subcommands, voice, samples, checks, load generator). Off by
# default, so the main build carries no test code; the `mumbot-tester` release enables it.
tester = ["dep:mumcord-codec", "dep:hound", "dep:bytes"]

[dev-dependencies]
bytes = "1"
tempfile = "3"

[[example]]
name = "loadtest"
required-features = ["tester"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Backtraces keep file and line numbers; full debug info would make target dirs much larger.
[profile.dev]
debug = "line-tables-only"

[profile.release]
# A long-running service: smaller binaries and image layers matter more than build time.
lto = "thin"
codegen-units = 1
strip = true
