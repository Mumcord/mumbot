[package]
name = "mumbot"
description = "Headless Mumble bots for standard Mumble servers: webhook, peer, history and music modules, plus a scripted test bot in the tester build"
version = "0.4.1"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/Mumcord/mumbot"
publish = false

[dependencies]
# Published by the Mumcord client project; a minor bump (by hand or Dependabot) must pass the
# live tests. mumcord-codec (Opus without device I/O, so static builds need no ALSA) gives the
# bots' voice the same codec settings as the client.
mumcord-protocol = "0.5"
mumcord-codec = "0.5"
bytes = "1"
hound = { version = "3.5", optional = true }
tokio = { version = "1.54", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
# Peer bot: TLS to the relay API with a pinned certificate, on the rustls/ring stack that
# mumcord-protocol already brings in (no extra crypto library).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ring = "0.17"
# The mumcord.peer messages (relay, token-req, token, token-err) from the crate Mumcord itself
# uses, so the bot and the client share one wire format.
mumcord-p2p = "0.5"
# Music module: pure-Rust MP3 decoding (MPL-2.0) that builds statically everywhere, a real-time
# safe ring buffer between the decode thread and the voice sender, and Mozilla's root store for
# https sources (the Alpine image has no reliable system store).
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
rtrb = "0.4"
webpki-roots = "1"
# History module: the recorded messages in one local file, like Mumcord's own store. Bundled,
# so the static musl builds need no system SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }

[features]
# The scripted test bot (test subcommands, voice, samples, checks, load generator). Off by
# default, so the main build carries no test code; the `mumbot-tester` release enables it.
tester = ["dep:hound"]

[dev-dependencies]
bytes = "1"
tempfile = "3"

[[example]]
name = "loadtest"
required-features = ["tester"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Backtraces keep file and line numbers; full debug info would make target dirs much larger.
[profile.dev]
debug = "line-tables-only"

[profile.release]
# A long-running service: smaller binaries and image layers matter more than build time.
lto = "thin"
codegen-units = 1
strip = true
