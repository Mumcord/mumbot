[package]
name = "mumbot"
description = "Headless Mumble bots for standard Mumble servers: a webhook bot and a scripted test bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/Mumcord/mumbot"
publish = false

[dependencies]
# Published by the Mumcord client project; a minor bump (by hand or Dependabot) must pass the
# live tests. mumcord-codec (Opus without device I/O, so static builds need no ALSA) gives the
# test bot's voice the same codec settings as the client.
mumcord-protocol = "0.4"
mumcord-codec = "0.4"
bytes = "1"
hound = "3.5"
tokio = { version = "1.54", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Backtraces keep file and line numbers; full debug info would make target dirs much larger.
[profile.dev]
debug = "line-tables-only"

[profile.release]
# A long-running service: smaller binaries and image layers matter more than build time.
lto = "thin"
codegen-units = 1
strip = true
