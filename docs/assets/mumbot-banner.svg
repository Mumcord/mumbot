<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="title">
  <title id="title">mumbot</title>
  <style>
    .ink { fill: #1b1d29; }
    .muted { fill: #5b6072; }
    .face { fill: #ffffff; }
    .wave { stroke: #7c5cff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f4f4f8; }
      .muted { fill: #a9adbd; }
      .face { fill: #161822; }
      .wave { stroke: #a08bff; }
    }
  </style>
  <!-- Robot head: a bot that talks into Mumble. -->
  <g transform="translate(24 20)">
    <line x1="60" y1="10" x2="60" y2="26" stroke="#7c5cff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="60" cy="8" r="8" fill="#7c5cff"/>
    <rect x="8" y="26" width="104" height="94" rx="26" fill="#7c5cff"/>
    <rect x="22" y="42" width="76" height="52" rx="16" class="face"/>
    <circle cx="44" cy="68" r="8" fill="#7c5cff"/>
    <circle cx="76" cy="68" r="8" fill="#7c5cff"/>
    <rect x="44" y="102" width="32" height="6" rx="3" class="face"/>
    <path d="M124 52 q12 21 0 42" fill="none" class="wave" stroke-width="6" stroke-linecap="round"/>
    <path d="M140 40 q22 33 0 66" fill="none" class="wave" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>
  <text x="208" y="88" class="ink" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">mumbot</text>
  <text x="211" y="124" class="muted" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20">Headless bots for any Mumble server</text>
</svg>
