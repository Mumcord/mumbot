name: CI

# Branch pushes run through their pull request; a push trigger on every branch would run
# everything twice. A branch without a pull request can be checked with a manual run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # No debug info: CI only needs pass/fail, and it makes linking faster and the caches smaller.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Decides whether the heavy jobs run. A path filter on the trigger would leave the required
  # check pending forever on pull requests without code changes, so the check always reports.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - id: filter
        run: scripts/ci/code-changed.sh >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  test:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS only build and run the unit tests: the release builds binaries there.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Both release variants: the main bot and mumbot-tester (spec 03, FR-3.13).
      - name: Rust lint (main)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust lint (tester)
        run: cargo clippy --all-targets --locked --features tester -- -D warnings

      - name: Rust tests (main)
        run: cargo test --locked

      - name: Rust tests (tester)
        run: cargo test --locked --features tester

  # The acceptance tests against an unmodified standard Mumble server in Docker (testenv/): the
  # modules, the test-bot library and CLI, and voice (play, record, level checks over UDP). They
  # use the test bot as the observer, so they run with the tester feature, a superset of the main
  # build.
  live:
    name: Live tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # up.sh seeds the channels with sqlite3. The runner image ships it; the fallback installs it
      # through the mirror-switching helper, because the default mirror often stalls.
      - name: Ensure sqlite3
        timeout-minutes: 10
        run: command -v sqlite3 || scripts/ci/apt-install.sh sqlite3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --locked --features tester --no-run

      - name: Start the test server
        run: |
          printf 'SUPERUSER_PASSWORD=%s\nSERVER_PASSWORD=\n' "$(openssl rand -hex 16)" > testenv/.env
          testenv/up.sh

      - name: Live and voice tests
        run: cargo test --locked --features tester -- --ignored --test-threads=1
        env:
          MUMBOT_LIVE: "1"

      - name: Server log on failure
        if: failure()
        run: docker compose -f testenv/docker-compose.yml -p mumbot-testenv logs --tail 50
        env:
          PORT_V15: "44738"
          DATA_ROOT: data
          SUPERUSER_PASSWORD: x

      - name: Stop the test server
        if: always()
        run: testenv/down.sh

  # Broadcast admission (tests/peer_broadcast_live.rs) against a real mumpeer relay and a Mumble
  # server, both from the mumpeer repository's testenv/. The peer bot runs inside the test, so
  # the testenv starts without its own bot (--no-bot). The suite runs once per relay profile
  # because each test skips itself when the running profile is not its own.
  # To bump mumpeer: set MUMPEER_REF below to a newer commit of Mumcord/mumpeer main
  # (`git ls-remote https://github.com/Mumcord/mumpeer refs/heads/main`).
  peer-live:
    name: Peer relay live tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUMPEER_REF: 6c7d1bb5dadb9fc413c7c7782d004ab93a8e7bb3
      MUMBOT_LIVE: "1"
      MUMBOT_PEER_RELAY: "1"
      MUMBOT_PORT_BASE: "44758"
      MUMBOT_TESTENV_DIR: ${{ github.workspace }}/mumpeer/testenv
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Mumcord/mumpeer
          ref: ${{ env.MUMPEER_REF }}
          path: mumpeer

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --locked --features tester --test peer_broadcast_live --no-run

      - name: Run with relay profile all
        run: |
          MUMPEER_PROFILE=all mumpeer/testenv/up.sh --no-bot
          cargo test --locked --features tester --test peer_broadcast_live -- --ignored --test-threads=1 --nocapture

      - name: Run with relay profile no-camera
        run: |
          MUMPEER_PROFILE=no-camera mumpeer/testenv/up.sh --no-bot
          cargo test --locked --features tester --test peer_broadcast_live -- --ignored --test-threads=1 --nocapture

      - name: Run with relay profile no-broadcast
        run: |
          MUMPEER_PROFILE=no-broadcast mumpeer/testenv/up.sh --no-bot
          cargo test --locked --features tester --test peer_broadcast_live -- --ignored --test-threads=1 --nocapture

      - name: Logs on failure
        if: failure()
        run: |
          cd mumpeer/testenv
          . ./env.sh
          docker compose logs --tail 50
        env:
          PUID: "1000"
          PGID: "1000"
          SUPERUSER_PASSWORD: x
          MUMPEER_API_SECRET: x

      - name: Stop the test environment
        if: always()
        run: mumpeer/testenv/down.sh

  docker:
    name: Docker image (${{ matrix.variant }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mumbot
            features: ""
          - variant: mumbot-tester
            features: tester
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: FEATURES=${{ matrix.features }}
          tags: mumbot:ci
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # The bot exits when its first login fails, so the image is checked against the local test
      # server: the container must report itself healthy and connected.
      - name: Start the test server
        run: |
          printf 'SUPERUSER_PASSWORD=%s\nSERVER_PASSWORD=\n' "$(openssl rand -hex 16)" > testenv/.env
          testenv/up.sh

      - name: Health check
        run: |
          printf '[server]\nhost = "127.0.0.1"\nport = 44738\nname = "Image Check"\nchannel = "Lobby"\n\n[http]\nlisten = "0.0.0.0:8080"\n\n[[keys]]\nkey = "%s"\nlabel = "ci"\nchannels = ["Lobby"]\n' "$(openssl rand -hex 16)" > bot.toml
          chmod 644 bot.toml
          docker run -d --name mumbot --network host -v "$PWD/bot.toml:/config/bot.toml:ro" mumbot:ci
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mumbot)
            if [ "$status" = healthy ] && curl -fsS http://127.0.0.1:8080/health | grep -q '"connected":true'; then
              echo "healthy and connected"; exit 0
            fi
            sleep 2
          done
          docker logs mumbot
          exit 1

      - name: Stop the test server
        if: always()
        run: testenv/down.sh

  # The Docker Compose examples (examples/<name>/): every compose file must be valid, and
  # webhook-with-server must come up with the image built from this change and deliver a message.
  # Runs on code changes too, because a new image can break an example.
  examples:
    name: Examples
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate every compose file
        run: |
          for dir in examples/*/; do
            [ -f "$dir/docker-compose.yml" ] || continue
            echo "checking $dir"
            docker compose -f "$dir/docker-compose.yml" --env-file "$dir/.env.example" --profile "*" config --quiet
          done

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          # The examples pin the released tag; this local tag makes them run this change's image
          # instead (Compose only pulls an image that is missing).
          tags: ghcr.io/mumcord/mumbot:0.5.2
          cache-from: type=gha,scope=mumbot

      - name: Smoke test webhook-with-server
        working-directory: examples/webhook-with-server
        run: |
          sed "s/^SUPERUSER_PASSWORD=.*/SUPERUSER_PASSWORD=$(openssl rand -hex 16)/" .env.example > .env
          key=$(openssl rand -hex 32)
          sed "s/REPLACE-WITH-A-LONG-RANDOM-KEY/$key/" bot.example.toml > bot.toml
          chmod 644 bot.toml
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8080/health | tee /dev/stderr | grep -q '"connected":true'
          curl -fsS -X POST http://127.0.0.1:8080/message -H "X-API-Key: $key" \
            -d '{"channel": 0, "message": "**smoke test** from CI"}' | tee /dev/stderr \
            | grep -q '"delivered":true'

      - name: Logs on failure
        if: failure()
        working-directory: examples/webhook-with-server
        run: docker compose logs --tail 50

      - name: Stop the example
        if: always()
        working-directory: examples/webhook-with-server
        run: docker compose down -v

  # Mumcord's smoke tests download the static linux-aarch64 mumbot-tester release binary; only a
  # tag would build it otherwise. linux-x86_64 is built by the Docker job, Windows and macOS by
  # the tests.
  static-arm64:
    name: Static build (linux-aarch64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build (same command as release.yml)
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e DEBIAN_FRONTEND=noninteractive \
            ghcr.io/rust-cross/cargo-zigbuild:0.24.0 sh -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake >/dev/null &&
             cargo zigbuild --release --locked --target aarch64-unknown-linux-musl --features tester'
          file target/aarch64-unknown-linux-musl/release/mumbot | tee /dev/stderr | grep -q 'ARM aarch64.*statically linked'

  # The one required status check. Runs even when the heavy jobs were skipped (no code change),
  # because a skipped job would not report its name.
  result:
    name: CI result
    needs: [changes, test, live, peer-live, docker, examples, static-arm64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "changes: $CHANGES, test: $TEST, live: $LIVE, peer-live: $PEERLIVE, docker: $DOCKER, examples: $EXAMPLES, static-arm64: $ARM64"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          [ "$CHANGES" = success ] && ok "$TEST" && ok "$LIVE" && ok "$PEERLIVE" && ok "$DOCKER" && ok "$EXAMPLES" \
            && ok "$ARM64"
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          LIVE: ${{ needs.live.result }}
          PEERLIVE: ${{ needs.peer-live.result }}
          DOCKER: ${{ needs.docker.result }}
          EXAMPLES: ${{ needs.examples.result }}
          ARM64: ${{ needs.static-arm64.result }}
