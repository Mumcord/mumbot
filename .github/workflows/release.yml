name: Release

# Pushing a tag `vX.Y.Z` on main checks that it matches the Cargo version, builds the binaries
# and the multi-arch Docker images, and creates a DRAFT GitHub release with the binaries and
# SHA256SUMS. The maintainer reviews and publishes the release by hand.
#
# Every release has two variants (specs/03-modules-specification.md): `mumbot`, the production
# modules only, and `mumbot-tester`, built with the `tester` feature (plus the scripted test bot).
on:
  push:
    tags: ["v*"]

# Never build the same tag twice at once; never cancel a running release build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Check tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0

      - name: Check tag against the Cargo version and main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || fail "Tag '$TAG' is not a version tag like v1.2.3."
          version=${TAG#v}
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [[ "$cargo" == "$version" ]] || fail "Cargo.toml version is '$cargo', but the tag says '$version'."
          # The builds use --locked, so a stale Cargo.lock would fail late; catch it here.
          locked=$(awk '$0 == "name = \"mumbot\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          [[ "$locked" == "$version" ]] || fail "Cargo.lock has mumbot '$locked' (run cargo check after bumping)."
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "Tag '$TAG' does not point to a commit on main."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary (${{ matrix.variant }}, ${{ matrix.name }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        variant: [mumbot, mumbot-tester]
        name: [linux-x86_64, linux-aarch64, windows-x86_64, macos-universal]
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FEATURES: ${{ matrix.variant == 'mumbot-tester' && '--features tester' || '' }}
    steps:
      - uses: actions/checkout@v7

      # Static musl binaries, cross-compiled with zig in the same builder image as the Dockerfile
      # (keep the two tags in sync; Dependabot only updates the Dockerfile). CMake builds Opus.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e DEBIAN_FRONTEND=noninteractive \
            ghcr.io/rust-cross/cargo-zigbuild:0.24.0 sh -c \
            "apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake >/dev/null &&
             cargo zigbuild --release --locked --target ${{ matrix.target }} $FEATURES"
          mkdir -p out && cp target/${{ matrix.target }}/release/mumbot out/

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} $FEATURES
          mkdir -p out && cp target/${{ matrix.target }}/release/mumbot.exe out/

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" $FEATURES
          done
          mkdir -p out
          lipo -create -output out/mumbot \
            target/aarch64-apple-darwin/release/mumbot target/x86_64-apple-darwin/release/mumbot
          lipo -info out/mumbot

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          cp LICENSE README.md CHANGELOG.md examples/bot.example.toml out/
          # Both variants hold a binary named `mumbot`, so scripts only change the archive name.
          name="${{ matrix.variant }}-$VERSION-${{ matrix.name }}"
          mkdir dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd out && 7z a "../dist/$name.zip" . >/dev/null)
          else
            tar -C out -czf "dist/$name.tar.gz" .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker image (${{ matrix.variant }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mumbot
            features: ""
          - variant: mumbot-tester
            features: tester
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `latest` only for plain versions; a pre-release tag like v0.2.0-rc.1 gets its version tag
      # alone. The image is pushed right away, while the GitHub release stays a draft.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mumcord/${{ matrix.variant }}
          tags: |
            type=raw,value=${{ needs.guard.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.guard.outputs.version, '-') }}

      # The build stage cross-compiles on the runner's own platform, so arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: FEATURES=${{ matrix.features }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Draft release
    needs: [guard, binaries, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mumbot-*
          path: dist
          merge-multiple: true

      - name: Create the draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Fails if any binary is missing.
          files=()
          for variant in mumbot mumbot-tester; do
            files+=("$variant-$VERSION-linux-x86_64.tar.gz" "$variant-$VERSION-linux-aarch64.tar.gz"
              "$variant-$VERSION-windows-x86_64.zip" "$variant-$VERSION-macos-universal.tar.gz")
          done
          ls -l -- "${files[@]}"
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<EOF
          ## Downloads

          Two variants: **mumbot** runs the production modules (webhook, peer); **mumbot-tester** adds the scripted test bot (checks, voice, samples) for testing Mumble servers and clients in CI.

          - **Linux** (static, any distribution): \`mumbot-$VERSION-linux-x86_64.tar.gz\` or \`mumbot-$VERSION-linux-aarch64.tar.gz\`
          - **Windows**: \`mumbot-$VERSION-windows-x86_64.zip\`
          - **macOS** (Apple Silicon and Intel): \`mumbot-$VERSION-macos-universal.tar.gz\`
          - **Docker** (linux/amd64, linux/arm64): \`docker pull ghcr.io/mumcord/mumbot:$VERSION\`
          - **Tester**: the same archives as \`mumbot-tester-$VERSION-<platform>\`, and \`docker pull ghcr.io/mumcord/mumbot-tester:$VERSION\`

          Each archive holds the \`mumbot\` binary at its top level. Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. Start with the README and \`bot.example.toml\` in the archive.

          Built by [this workflow run]($RUN_URL). Licensed under the [GNU AGPL-3.0](https://github.com/Mumcord/mumbot/blob/main/LICENSE) only.

          Full changelog: [CHANGELOG.md](https://github.com/Mumcord/mumbot/blob/main/CHANGELOG.md)
          EOF
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag \
            --title "Mumbot $VERSION" --notes-file ../notes.md -- "${files[@]}" SHA256SUMS
