name: Feature request
description: Suggest an idea or improvement for Mumbot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Mumbot is a pure Mumble client: features must work with any unmodified Mumble server.
        Check the [README](https://github.com/Mumcord/mumbot#readme) first – your idea may already exist or be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Webhook
        - Test-bot CLI
        - History bot
        - Music bot
        - Config and setup
        - Docker and releases
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've considered
